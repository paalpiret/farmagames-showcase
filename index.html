<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piret Paal — Interactive Nursing Projects</title>
<meta name="description" content="Piret Paal: interactive nursing projects and game prototypes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<!--
  Layout, colors and behaviour only. Every piece of visible page text
  (EN + FI) lives in content.js; elements here are filled from it via
  data-i18n="key" (text) and data-i18n-alt="key" (image alt text).
-->
<style>
  :root {
    /* Dark theme surfaces */
    --deep: #0F2E28;          /* menu, header, Scenario games, About, footer */
    --raised: #143A33;        /* Card games band, Contact band, Why card */
    --line-dark: #2E5A50;     /* thin borders on dark surfaces */
    --mint: #D8E9E5;          /* Learning tools band */

    /* Text */
    --on-dark: #C9DDD7;       /* body text on dark */
    --on-dark-soft: #A9C4BC;  /* small print on dark (references, citations, footer) */
    --heading-light: #0F2E28; /* headings on white / mint */
    --text-light: #4E5B58;    /* body text on white / mint */
    --ink: #1A1A1A;           /* text on amber and on the coloured tiles */
    --white: #FFFFFF;

    /* Accents */
    --amber: #FFB547;         /* "played", primary buttons, focus ring on dark */
    --teal-link: #157565;     /* links, labels + filled buttons on light surfaces */
    --tile-farmarush: #FF9F1A;
    --tile-myday: #A78BFA;
    --edge-medichain: #38BDF8;
    --edge-medilink: #3ED07A;
    --error-on-dark: #FFB4A8;

    /* Shape */
    --radius: 0.75rem;
    --radius-lg: 1.25rem;

    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-display: 'Space Grotesk', var(--font-sans);
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }

  body {
    margin: 0;
    font-family: var(--font-sans);
    background: var(--deep);
    color: var(--on-dark);
    line-height: 1.6;
  }

  h1, h2, h3 {
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.15;
  }

  .container {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  /* Keyboard focus: amber ring on dark surfaces, dark ring on light ones */
  :focus-visible {
    outline: 3px solid var(--amber);
    outline-offset: 2px;
  }
  .tile :focus-visible,
  .card :focus-visible,
  .tool-card :focus-visible {
    outline-color: var(--deep);
  }

  /* ── Buttons ────────────────────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.7rem 1.35rem;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
    text-decoration: none;
    border: 2px solid transparent;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.15s ease, background 0.15s ease;
  }
  .btn:hover { filter: brightness(0.95); transform: translateY(-1px); }

  .btn-amber   { background: var(--amber); color: var(--ink); }
  .btn-outline { background: transparent; color: var(--white); border-color: var(--white); }
  .btn-outline:hover { background: rgba(255, 255, 255, 0.08); filter: none; }

  /* Hero buttons (design sketch) */
  .hero-actions .btn {
    padding: 15px 26px;
    border-radius: 12px;
    font-size: 16px;
    border-width: 1px;
  }
  .hero-actions .btn-amber   { background: #FFB547; color: #1A1A1A; font-weight: 700; }
  .hero-actions .btn-outline { background: transparent; border: 1px solid #4F7A70; color: #FFFFFF; font-weight: 600; }
  .btn-teal    { background: var(--teal-link); color: var(--white); }

  /* Learning tools buttons (design sketch) */
  .tool-card .btn-teal {
    background: #157565;
    color: #FFFFFF;
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 700;
  }

  /* ── 1. Top menu ────────────────────────────────────────── */
  .topnav {
    background: var(--deep);
    border-bottom: 1px solid var(--line-dark);
    z-index: 50;
  }

  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem 1.5rem;
    padding-top: 0.85rem;
    padding-bottom: 0.85rem;
  }

  /* Wordmark "clinicalgames" (design sketch): one word, lowercase,
     "clinical" white + "games" mint. Links to the very top of the page. */
  .brand {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0;
    text-transform: none;
    color: var(--white);
    text-decoration: none;
  }
  .brand-a { color: #FFFFFF; }
  .brand-b { color: #7BE3C6; }

  .nav-right {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem 1.25rem;
  }

  .nav-links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem 1.25rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .nav-links a {
    display: inline-block;
    padding: 0.3rem 0;
    color: var(--on-dark);
    font-size: 0.92rem;
    font-weight: 500;
    text-decoration: none;
  }
  .nav-links a:hover { color: var(--white); text-decoration: underline; text-underline-offset: 4px; }

  .lang-toggle {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    border: 1px solid var(--line-dark);
    border-radius: 999px;
    padding: 0.25rem;
  }

  .lang-btn {
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--on-dark);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.3rem 0.65rem;
    border-radius: 999px;
    transition: color 0.15s ease, background 0.15s ease;
  }

  .lang-btn.active {
    color: var(--deep);
    background: var(--white);
    font-weight: 800;
  }

  /* Menu stays visible while scrolling on wider screens only —
     on phones it wraps to two lines and would take too much room. */
  @media (min-width: 721px) {
    .topnav { position: sticky; top: 0; }
    section[id] { scroll-margin-top: 4.5rem; }
  }

  /* ── 2. Header ──────────────────────────────────────────── */
  .hero {
    background: var(--deep);
    padding: 4.5rem 0;
  }

  .hero-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    gap: 3.5rem;
    align-items: start;
  }

  .hero-headline {
    margin: 0 0 1.25rem;
    font-size: clamp(2.25rem, 4.6vw, 3.6rem);
    color: var(--white);
  }
  .hero-headline .hl { color: var(--amber); }

  .hero-subline {
    margin: 0 0 2rem;
    max-width: 34rem;
    font-size: 1.12rem;
    color: var(--on-dark);
  }

  .hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.85rem;
  }

  /* Two-column header: both columns share one height, the Why card
     stretches to fill its column and the two buttons sit at the bottom
     of theirs, so the buttons' bottom edge lines up with the card's
     bottom edge (whichever side is taller sets the height). */
  @media (min-width: 861px) {
    .hero-grid { align-items: stretch; }
    .hero-text { display: flex; flex-direction: column; }
    .hero-actions { margin-top: auto; }
    .hero-why { display: flex; flex-direction: column; }
    .why-card { flex: 1 1 auto; }
  }

  /* ── Why carousel card (values from the design sketch) ─── */
  .why-card {
    background: #143A33;
    border: 1px solid #2E5A50;
    border-radius: 22px;
    padding: 36px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 28px;
  }

  .why-label {
    margin: 0;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #FFB547;
  }

  /* Height that fits the tallest slide: every slide sits in the same
     grid cell, and invisible copies of all four (desktop only) keep the
     card as tall as the longest one, so it never jumps. Phones: auto. */
  .why-stage { display: grid; grid-template-columns: minmax(0, 1fr); }
  .why-stage > .why-slide { grid-area: 1 / 1; }
  .why-slide.sizer { visibility: hidden; }
  .why-slide [hidden] { display: none; }
  @media (max-width: 860px) {
    .why-slide.sizer { display: none; }
  }

  .why-quote-wrap {
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .why-quote {
    margin: 0;
    font-family: var(--font-display);
    font-size: 28px;
    line-height: 1.3;
    font-weight: 500;
    color: #FFFFFF;
    /* a word longer than the line (long Finnish words on phones)
       breaks instead of running out of the card */
    overflow-wrap: break-word;
  }
  /* Finnish only: hyphenate long compound words where the browser can */
  :lang(fi) .why-quote { hyphens: auto; }

  .why-citation {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 14px;
    color: #A9C4BC;
  }

  .why-sources {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .why-sources p {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.55;
    color: #C9DDD7;
  }

  .why-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .why-dots {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .why-dot {
    width: 10px;
    height: 10px;
    padding: 0;
    border: none;
    border-radius: 999px;
    background: #4F7A70;
    cursor: pointer;
  }
  .why-dot[aria-current="true"] {
    width: 28px;
    background: #FFB547;
  }

  .why-buttons {
    display: flex;
    gap: 10px;
  }

  .why-arrow {
    width: 44px;
    height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border-radius: 50%;
    font-family: var(--font-sans);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }
  .why-prev { background: transparent; border: 1px solid #4F7A70; color: #FFFFFF; }
  .why-next { background: #FFB547; border: none; color: #1A1A1A; }

  /* ── Bands + section headings ───────────────────────────── */
  .band { padding: 4.5rem 0; }
  .band-deep   { background: var(--deep); }
  .band-raised { background: var(--raised); }
  .band-mint   { background: var(--mint); }

  /* Section title row: heading left, subtitle at the right end of the
     same line; on narrow screens the subtitle wraps under by itself. */
  .section-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 28px;
  }
  .section-head h2 {
    margin: 0;
    font-size: 40px;
    font-weight: 700;
    color: var(--white);
  }
  .section-sub {
    margin: 0;
    font-size: 17px;
    color: var(--on-dark-soft);
  }
  .band-mint .section-head h2 { color: var(--heading-light); }

  /* Phones only: section headings scale with screen width (28px at
     320px wide up to 34px), so the long Finnish word
     "Oppimissovellukset" always fits. Desktop stays exactly 40px. */
  @media (max-width: 720px) {
    .section-head h2 { font-size: clamp(28px, calc((100vw - 48px) / 9.6), 34px); }
  }
  .band-mint .section-sub { color: var(--text-light); }

  .game-label {
    display: block;
    margin-bottom: 0.45rem;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* ── Image frames: all 16:9, white, never cropped (except .cover) ── */
  .media-frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: var(--radius);
    background: var(--white);
    overflow: hidden;
  }
  .media-frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    cursor: zoom-in;
  }
  /* MyDay + PleksusDiaries files are slightly narrower than 16:9 —
     cover fills the frame instead of leaving white side strips. */
  .media-frame img.cover { object-fit: cover; }

  /* ── 3. Scenario games: two large coloured tiles ────────── */
  .tile-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1.75rem;
  }

  /* Tiles in a row are equal height (grid stretch); each is a flex
     column so the Play link sits at the bottom of every tile. */
  .tile {
    display: flex;
    flex-direction: column;
    border-radius: var(--radius-lg);
    padding: 1.25rem 1.25rem 1.75rem;
    color: var(--ink);
  }
  .tile-farmarush { background: var(--tile-farmarush); }
  .tile-myday     { background: var(--tile-myday); }

  .tile-body { padding: 1.4rem 0.5rem 0; flex: 1 1 auto; display: flex; flex-direction: column; }
  .tile h3 { margin: 0 0 0.6rem; font-size: 1.85rem; color: var(--ink); }
  .tile p  { margin: 0 0 1.4rem; font-size: 1rem; color: var(--ink); }
  .tile .game-label { color: var(--ink); }

  .tile-link {
    margin-top: auto;
    align-self: flex-start;
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 700;
    color: #1A1A1A;
    background: none;
    border: none;
    text-decoration: none;
  }
  .tile-link:hover { text-decoration: underline; text-underline-offset: 4px; }

  /* ── 4. Card games: white cards with a coloured top edge ── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1.75rem;
  }

  .card {
    display: flex;
    flex-direction: column;
    background: var(--white);
    border-radius: var(--radius-lg);
    border-top: 6px solid transparent;
    padding: 1.25rem 1.25rem 1.5rem;
  }
  .card-medichain { border-top-color: var(--edge-medichain); }
  .card-medilink  { border-top-color: var(--edge-medilink); }

  .card-body { padding: 1.25rem 0.35rem 0; flex: 1 1 auto; display: flex; flex-direction: column; }
  .card h3 { margin: 0 0 0.5rem; font-size: 26px; color: var(--heading-light); }
  .card .text-link { margin-top: auto; align-self: flex-start; }
  .card p  { margin: 0 0 1.1rem; font-size: 0.97rem; color: var(--text-light); }
  .card .game-label { color: var(--teal-link); }

  .text-link {
    color: var(--teal-link);
    font-weight: 700;
    text-decoration: none;
  }
  .text-link:hover { text-decoration: underline; text-underline-offset: 4px; }

  /* ── 5. Learning tools: stacked white cards, image left ─── */
  .tool-list {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .tool-card {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 32px;
    align-items: center;
    background: var(--white);
    border: 1px solid #DCE7E3;
    border-radius: 20px;
    padding: 24px;
  }

  .tool-body { padding: 0.5rem 0.75rem 0.5rem 0; }
  .tool-card h3 { margin: 0 0 0.5rem; font-family: var(--font-display); font-size: 30px; color: var(--heading-light); }
  .tool-card p  { margin: 0 0 1.2rem; font-size: 0.97rem; color: var(--text-light); }
  .tool-card .game-label { color: var(--teal-link); }

  /* ── 6. About ───────────────────────────────────────────── */
  .about-inner { max-width: 760px; }
  .about-inner h2 {
    margin: 0 0 1.25rem;
    font-size: clamp(1.75rem, 3vw, 2.25rem);
    color: var(--white);
  }
  .about-inner p { margin: 0 0 1.1rem; color: var(--on-dark); }
  .about-inner p:last-child { margin-bottom: 0; }
  /* Thesis link inside About paragraph 2 (opens the PDF in a new tab) */
  .about-link { color: #7BE3C6; text-decoration: underline; }

  /* ── 7. Contact ─────────────────────────────────────────── */
  .contact-inner h2 {
    margin: 0 0 1.5rem;
    font-size: clamp(1.75rem, 3vw, 2.25rem);
    color: var(--white);
  }

  /* Intro sentence under the heading — same body text style as About */
  .contact-intro {
    margin: 0 0 1.5rem;
    max-width: 760px;
    color: var(--on-dark);
  }

  .contact-form {
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
    max-width: 520px;
  }

  .contact-form label {
    display: block;
    margin-bottom: 0.4rem;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--white);
  }

  .contact-form input,
  .contact-form textarea {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: var(--white);
    border: 2px solid var(--white);
    border-radius: var(--radius);
    padding: 0.65rem 0.85rem;
  }

  .contact-form textarea {
    min-height: 140px;
    resize: vertical;
  }

  .contact-form .btn { align-self: flex-start; }

  .form-hidden { display: none; }

  .contact-success,
  .contact-error {
    margin: 1rem 0 0;
    max-width: 520px;
    padding: 0.85rem 1.1rem;
    border-radius: var(--radius);
    font-size: 0.95rem;
    background: var(--deep);
  }
  .contact-success { color: var(--white); border: 1px solid var(--line-dark); }
  .contact-error   { color: var(--error-on-dark); border: 1px solid var(--error-on-dark); }

  /* ── 8. Footer ──────────────────────────────────────────── */
  footer {
    background: var(--deep);
    border-top: 1px solid var(--line-dark);
    text-align: center;
    padding: 2rem 1.5rem;
    font-size: 0.85rem;
    color: var(--on-dark-soft);
  }

  /* ── Image lightbox ─────────────────────────────────────── */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: rgba(15, 20, 25, 0.82);
  }
  .lightbox.hidden { display: none; }
  .lightbox img {
    display: block;
    max-width: 90vw;
    max-height: 90vh;
    width: auto;
    height: auto;
    border-radius: 12px;
    background: var(--white);
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
  }
  .lightbox-close {
    position: absolute;
    top: 1.25rem;
    right: 1.5rem;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.15);
    border: none;
    border-radius: 50%;
    color: #ffffff;
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .lightbox-close:hover { background: rgba(255, 255, 255, 0.3); }

  /* ── Phones / narrow screens ────────────────────────────── */
  @media (max-width: 860px) {
    .hero-grid,
    .tile-grid,
    .card-grid { grid-template-columns: minmax(0, 1fr); }
    .hero-grid { gap: 2.75rem; }
  }

  @media (max-width: 720px) {
    .hero { padding: 3rem 0; }
    .band { padding: 3.25rem 0; }
    .tool-card { grid-template-columns: minmax(0, 1fr); gap: 1rem; }
    .tool-body { padding: 0.25rem 0.35rem 0.5rem; }
    .tile h3 { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<!-- 1. Top menu -->
<nav class="topnav" aria-label="Main">
  <div class="container nav-inner">
    <a class="brand" href="#top"><span class="brand-a" data-i18n="wordmark_clinical"></span><span class="brand-b" data-i18n="wordmark_games"></span></a>
    <div class="nav-right">
      <ul class="nav-links">
        <li><a href="#scenario-games" data-i18n="nav_games"></a></li>
        <li><a href="#learning-tools" data-i18n="nav_tools"></a></li>
        <li><a href="#about" data-i18n="nav_about"></a></li>
        <li><a href="#contact" data-i18n="nav_contact"></a></li>
      </ul>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="fi">FI</button>
      </div>
    </div>
  </div>
</nav>

<!-- 2. Header: headline + Why carousel -->
<header class="hero">
  <div class="container hero-grid">
    <div class="hero-text">
      <h1 class="hero-headline"><span data-i18n="hero_headline_start"></span><span class="hl" data-i18n="hero_headline_highlight"></span><span data-i18n="hero_headline_end"></span></h1>
      <p class="hero-subline" data-i18n="hero_subline"></p>
      <div class="hero-actions">
        <a class="btn btn-amber" href="#scenario-games"><span data-i18n="hero_btn_games"></span></a>
        <a class="btn btn-outline" href="#learning-tools"><span data-i18n="hero_btn_tools"></span></a>
      </div>
    </div>

    <div class="hero-why">
      <div class="why-card" id="why-carousel" role="region" aria-roledescription="carousel" aria-labelledby="why-label">
        <p class="why-label" id="why-label"><span id="why-label-text" data-i18n="why_carousel_label"></span> · <span id="why-count"></span></p>
        <div class="why-stage">
          <!-- Invisible copies of all four slides: keep the card as tall as the tallest one (desktop). -->
          <div class="why-slide sizer" aria-hidden="true">

<!-- All page text (EN + FI) lives in content.js; this page is layout only. -->
<script src="content.js"></script>
<script>
  var LANG_KEY = 'fg-lang';
  var currentLang = 'en';

  function t(key, lang) {
    var entry = translations[key];
    if (!entry) return '';
    if (lang === 'fi' && Object.prototype.hasOwnProperty.call(entry, 'fi')) {
      return entry.fi;
    }
    return entry.en;
  }

  function applyLanguage(lang) {
    currentLang = lang;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var text = t(el.getAttribute('data-i18n'), lang);
      el.textContent = text;
      el.style.display = text === '' ? 'none' : '';
    }
    var altNodes = document.querySelectorAll('[data-i18n-alt]');
    for (var a = 0; a < altNodes.length; a++) {
      altNodes[a].setAttribute('alt', t(altNodes[a].getAttribute('data-i18n-alt'), lang));
    }
    document.documentElement.setAttribute('lang', lang);
    var buttons = document.querySelectorAll('.lang-btn');
    for (var j = 0; j < buttons.length; j++) {
      buttons[j].classList.toggle('active', buttons[j].getAttribute('data-lang') === lang);
    }
  }

  function setLanguage(lang) {
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyLanguage(lang);
  }

  var langButtons = document.querySelectorAll('.lang-btn');
  for (var k = 0; k < langButtons.length; k++) {
    langButtons[k].addEventListener('click', function () {
      setLanguage(this.getAttribute('data-lang'));
    });
  }

  var savedLang = null;
  try { savedLang = localStorage.getItem(LANG_KEY); } catch (e) {}
  if (!savedLang) {
    savedLang = location.hostname.indexOf('clinicalgames.fi') !== -1 ? 'fi' : 'en';
  }
  applyLanguage(savedLang);

  // ── Why carousel: moves only when clicked (no auto-slide) ──
  // Slides 1–3 = the three quotes, slide 4 = Sources (all three references).
  var WHY_COUNT = 4;
  var whyIndex = 0;
  var whyQuoteWrap = document.getElementById('why-quote-wrap');
  var whyQuote = document.getElementById('why-quote');
  var whyCitation = document.getElementById('why-citation');
  var whySources = document.getElementById('why-sources');
  var whyLabelText = document.getElementById('why-label-text');
  var whyCounter = document.getElementById('why-count');
  var whyDots = document.querySelectorAll('.why-dot');

  function showWhy(index) {
    whyIndex = (index + WHY_COUNT) % WHY_COUNT;
    var n = whyIndex + 1;
    var isSources = whyIndex === WHY_COUNT - 1;
    whyQuoteWrap.hidden = isSources;
    whySources.hidden = !isSources;
    // Swapping the keys also keeps the slide right after a language switch.
    if (!isSources) {
      whyQuote.setAttribute('data-i18n', 'why' + n + '_statement');
      whyCitation.setAttribute('data-i18n', 'why' + n + '_citation');
      whyQuote.textContent = t('why' + n + '_statement', currentLang);
      whyCitation.textContent = t('why' + n + '_citation', currentLang);
    }
    var labelKey = isSources ? 'why_sources_label' : 'why_carousel_label';
    whyLabelText.setAttribute('data-i18n', labelKey);
    whyLabelText.textContent = t(labelKey, currentLang);
    whyCounter.textContent = n + ' / ' + WHY_COUNT;
    for (var d = 0; d < whyDots.length; d++) {
      whyDots[d].setAttribute('aria-current', d === whyIndex ? 'true' : 'false');
    }
  }

  document.getElementById('why-prev').addEventListener('click', function () { showWhy(whyIndex - 1); });
  document.getElementById('why-next').addEventListener('click', function () { showWhy(whyIndex + 1); });
  for (var w = 0; w < whyDots.length; w++) {
    whyDots[w].addEventListener('click', function () {
      showWhy(parseInt(this.getAttribute('data-slide'), 10));
    });
  }
  document.getElementById('why-carousel').addEventListener('keydown', function (event) {
    if (event.key === 'ArrowLeft') showWhy(whyIndex - 1);
    if (event.key === 'ArrowRight') showWhy(whyIndex + 1);
  });
  showWhy(0);

  // ── Image lightbox ──────────────────────────────────────
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');

  function openLightbox(src, alt) {
    lightboxImg.src = src;
    lightboxImg.alt = alt || '';
    lightbox.classList.remove('hidden');
  }

  function closeLightbox() {
    lightbox.classList.add('hidden');
    lightboxImg.src = '';
  }

  var sectionImages = document.querySelectorAll('.media-frame img');
  for (var m = 0; m < sectionImages.length; m++) {
    sectionImages[m].addEventListener('click', function () {
      openLightbox(this.src, this.alt);
    });
  }

  lightbox.addEventListener('click', function (event) {
    if (event.target === lightbox) closeLightbox();
  });

  document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') closeLightbox();
  });

  // ── Contact form (Formspree AJAX) ───────────────────────
  var contactForm = document.getElementById('contact-form');
  var contactSuccess = document.getElementById('contact-success');
  var contactError = document.getElementById('contact-error');

  contactForm.addEventListener('submit', function (event) {
    event.preventDefault();
    contactError.classList.add('form-hidden');

    fetch(contactForm.action, {
      method: 'POST',
      body: new FormData(contactForm),
      headers: { 'Accept': 'application/json' }
    }).then(function (response) {
      if (response.ok) {
        contactForm.classList.add('form-hidden');
        contactSuccess.classList.remove('form-hidden');
      } else {
        contactError.classList.remove('form-hidden');
      }
    }).catch(function () {
      contactError.classList.remove('form-hidden');
    });
  });
</script>
