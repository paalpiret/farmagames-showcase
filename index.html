<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piret Paal — Interactive Nursing Projects</title>
<meta name="description" content="Piret Paal: interactive nursing projects and game prototypes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Core tokens */
    --background: #F6FBF9;
    --foreground: #1F2C3D;
    --card: #FFFFFF;
    --card-foreground: #1F2C3D;
    --primary: #20A386;
    --primary-dark: #167B65;
    --hero-gradient-start: #2FC9A6;
    --secondary: #EAF3F0;
    --accent: #EAF3F0;
    --muted: #D6E7E1;
    --muted-foreground: #6B7280;
    --border: #DBE9E4;
    --destructive: #DC2E2E;

    /* Per-game accents */
    --accent-myday: #A78BFA;
    --accent-farmarush: #FF9F1A;
    --accent-medichain: #38BDF8;
    --accent-medilink: #3ED07A;
    --accent-yellow: #F5C51F;
    --accent-yellow-foreground: #2E1F0F;
    --accent-coral: #FF7A66;
    --accent-coral-foreground: #7A2E1F;
    --accent-pleksus: #F9FBFA;

    /* Shape */
    --radius: 0.75rem;
    --radius-lg: 1rem;

    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font-sans);
    background: var(--background);
    color: var(--foreground);
    line-height: 1.6;
  }

  a { color: var(--primary); }

  /* ── Header ─────────────────────────────────────────────── */
  header {
    position: relative;
    width: 100%;
    padding: 4.5rem 1.5rem 3.5rem;
    text-align: center;
    background: var(--primary-dark);
    overflow: hidden;
  }

  /* Mesh-gradient effect: blurred color blobs over the dark-teal base,
     contained by the header's own overflow:hidden. */
  .hero-mesh {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }

  .hero-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
  }

  .hero-blob-1 {
    top: -90px;
    left: -80px;
    width: 380px;
    height: 380px;
    background: var(--hero-gradient-start);
    opacity: 0.7;
  }

  .hero-blob-2 {
    bottom: -120px;
    right: -70px;
    width: 440px;
    height: 440px;
    background: #38BDF8;
    opacity: 0.35;
    filter: blur(80px);
  }

  .hero-blob-3 {
    top: -70px;
    right: 12%;
    width: 320px;
    height: 320px;
    background: var(--primary);
    opacity: 0.6;
    filter: blur(60px);
  }

  .hero-glow {
    position: absolute;
    top: 3rem;
    left: 50%;
    transform: translateX(-50%);
    width: 620px;
    max-width: 90%;
    height: 220px;
    background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0) 70%);
  }

  .hero-content {
    position: relative;
    z-index: 1;
  }

  .hero-eyebrow {
    display: block;
    margin: 0 0 0.7rem;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(255, 255, 255, 0.7);
  }

  header h1 {
    margin: 0 0 0.6rem;
    font-size: 3.125rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #ffffff;
  }

  header p {
    margin: 0;
    font-size: 1.1rem;
    color: #ffffff;
  }

  .hero-tagline {
    margin: 0.85rem auto 0;
    max-width: 34rem;
    font-size: 0.95rem;
    font-style: italic;
    color: rgba(255, 255, 255, 0.75);
  }

  /* ── Full-width bands ───────────────────────────────────────
     Every section below the header is a full-bleed band: the
     background spans edge-to-edge, while a centered .container
     keeps the actual content in a comfortable reading width. */
  .band {
    width: 100%;
  }

  .band .container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 2.75rem 1.5rem;
  }

  h2 {
    font-size: 1.4rem;
    font-weight: 700;
    margin: 0 0 0.6rem;
  }

  /* ── Alternating section backgrounds ────────────────────────
     Every band down the page alternates white / teal-tint so no
     two consecutive sections share a background. */
  .bg-white { background: #FFFFFF; }
  .bg-tint { background: var(--secondary); }

  /* ── Game sections ──────────────────────────────────────── */
  .game-band .container {
    padding-top: 3.75rem;
    padding-bottom: 3.75rem;
  }

  /* Plain-text label for numbered game sections (no pill/background) —
     uses one consistent teal, not the per-game accent color. */
  .game-label {
    display: block;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--primary-dark);
    margin-bottom: 0.7rem;
  }

  .game-band h2 { margin-bottom: 0.35rem; }

  .game-band p {
    margin: 0 0 1.1rem;
    color: var(--muted-foreground);
    font-size: 0.95rem;
  }

  /* One consistent teal for every Play button, including FarmaDiary's. */
  .play-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--primary);
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    padding: 0.6rem 1.3rem;
    border-radius: var(--radius);
    font-weight: 600;
    text-decoration: none;
    transition: filter 0.15s ease, transform 0.15s ease;
  }

  .play-btn:hover {
    filter: brightness(0.93);
    transform: translateY(-1px);
  }

  .game-flex {
    display: flex;
    align-items: center;
    gap: 2.5rem;
  }

  .game-flex.reverse { flex-direction: row-reverse; }

  .game-text {
    flex: 1 1 50%;
    min-width: 0;
  }

  .game-media {
    flex: 1 1 50%;
    min-width: 0;
  }

  .game-media-box {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 20px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    background: color-mix(in srgb, var(--accent) 10%, var(--card));
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* The usual 10%-accent tint (above) is a deliberate subtle design
     choice for illustrated key-art. PleksusDiaries' image is a literal
     screenshot, so its frame instead matches the photo's own background
     color exactly (no dilution), or a seam shows at the image edges. */
  .game-media-box.exact-bg {
    background: var(--accent);
  }

  .game-media-box img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    cursor: zoom-in;
  }

  /* MyDay's illustration is a slightly different aspect ratio than the
     16:9 frame, which left pale bars down each side under object-fit:
     contain. Cover fills the frame instead, trimming a small sliver off
     the top/bottom (safe — the art has headroom there) rather than
     showing empty space on the sides. */
  .game-media-box img.fill-crop {
    object-fit: cover;
  }

  @media (max-width: 720px) {
    .game-flex,
    .game-flex.reverse {
      flex-direction: column;
    }
    .game-text, .game-media { flex: 1 1 auto; max-width: 100%; }
  }

  /* ── Why section ────────────────────────────────────────── */
  .why-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.25rem;
  }

  .why-card {
    border-radius: var(--radius-lg);
    padding: 1.5rem;
  }

  .why-card.coral { background: color-mix(in srgb, var(--accent-coral) 18%, white); }
  .why-card.teal { background: var(--secondary); }
  .why-card.yellow { background: color-mix(in srgb, var(--accent-yellow) 18%, white); }

  .why-statement {
    margin: 0 0 0.75rem;
    font-size: 0.98rem;
    font-weight: 400;
    color: var(--muted-foreground);
  }

  .why-citation {
    margin: 0;
    font-size: 0.82rem;
    font-style: italic;
    color: var(--muted-foreground);
  }

  @media (max-width: 720px) {
    .why-grid { grid-template-columns: 1fr; }
  }

  .why-references {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }

  .why-references p {
    margin: 0 0 0.85rem;
    font-size: 0.78rem;
    line-height: 1.8;
    color: var(--muted-foreground);
  }

  .why-references p:last-child {
    margin-bottom: 0;
  }

  /* ── About ──────────────────────────────────────────────── */
  .about-band p {
    margin: 0 0 1.1rem;
    color: var(--muted-foreground);
  }

  .about-band p:last-child {
    margin-bottom: 0;
  }

  /* ── Contact ────────────────────────────────────────────── */
  .contact-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    max-width: 480px;
  }

  .contact-form label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.35rem;
    color: var(--foreground);
  }

  .contact-form input,
  .contact-form textarea {
    width: 100%;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--foreground);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.65rem 0.85rem;
  }

  .contact-form input:focus,
  .contact-form textarea:focus {
    outline: none;
    border-color: var(--primary);
  }

  .contact-form textarea {
    min-height: 120px;
    resize: vertical;
  }

  .submit-btn {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--primary);
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    border: none;
    cursor: pointer;
    padding: 0.6rem 1.3rem;
    border-radius: var(--radius);
    font-weight: 600;
    font-size: 1rem;
    font-family: inherit;
    line-height: inherit;
    transition: filter 0.15s ease, transform 0.15s ease;
  }

  .submit-btn:hover {
    filter: brightness(0.93);
    transform: translateY(-1px);
  }

  .form-hidden {
    display: none;
  }

  .contact-success,
  .contact-error {
    margin: 1rem 0 0;
    max-width: 480px;
    padding: 0.85rem 1.1rem;
    border-radius: var(--radius);
    font-size: 0.95rem;
  }

  .contact-success {
    background: var(--secondary);
    color: var(--primary-dark);
  }

  .contact-error {
    background: color-mix(in srgb, var(--destructive) 12%, white);
    color: var(--destructive);
  }

  /* ── Footer ─────────────────────────────────────────────── */
  footer {
    text-align: center;
    padding: 2rem 1.5rem;
    font-size: 0.85rem;
    color: var(--muted-foreground);
  }

  /* ── Image lightbox ─────────────────────────────────────── */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: rgba(15, 20, 25, 0.82);
  }

  .lightbox.hidden {
    display: none;
  }

  .lightbox img {
    display: block;
    max-width: 90vw;
    max-height: 90vh;
    width: auto;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
  }

  .lightbox-close {
    position: absolute;
    top: 1.25rem;
    right: 1.5rem;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.15);
    border: none;
    border-radius: 50%;
    color: #ffffff;
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .lightbox-close:hover {
    background: rgba(255, 255, 255, 0.3);
  }

  /* ── Language toggle ────────────────────────────────────── */
  .lang-toggle {
    position: fixed;
    top: 1rem;
    right: 1rem;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.3rem;
    box-shadow: 0 1px 3px rgba(31, 44, 61, 0.08);
  }

  .lang-btn {
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted-foreground);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.3rem 0.6rem;
    border-radius: 999px;
    transition: color 0.15s ease, background 0.15s ease, font-weight 0.15s ease;
  }

  .lang-btn.active {
    color: var(--primary-dark);
    background: var(--secondary);
    font-weight: 800;
  }
</style>
</head>

<!-- All page text (EN + FI) lives in content.js; this page is layout only. -->
<script src="content.js"></script>
<script>
  var LANG_KEY = 'fg-lang';

  function t(key, lang) {
    var entry = translations[key];
    if (!entry) return '';
    if (lang === 'fi' && Object.prototype.hasOwnProperty.call(entry, 'fi')) {
      return entry.fi;
    }
    return entry.en;
  }

  function applyLanguage(lang) {
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var text = t(el.getAttribute('data-i18n'), lang);
      el.textContent = text;
      el.style.display = text === '' ? 'none' : '';
    }
    var altNodes = document.querySelectorAll('[data-i18n-alt]');
    for (var a = 0; a < altNodes.length; a++) {
      altNodes[a].setAttribute('alt', t(altNodes[a].getAttribute('data-i18n-alt'), lang));
    }
    document.documentElement.setAttribute('lang', lang);
    var buttons = document.querySelectorAll('.lang-btn');
    for (var j = 0; j < buttons.length; j++) {
      buttons[j].classList.toggle('active', buttons[j].getAttribute('data-lang') === lang);
    }
  }

  function setLanguage(lang) {
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyLanguage(lang);
  }

  var langButtons = document.querySelectorAll('.lang-btn');
  for (var k = 0; k < langButtons.length; k++) {
    langButtons[k].addEventListener('click', function () {
      setLanguage(this.getAttribute('data-lang'));
    });
  }

  var savedLang = null;
  try { savedLang = localStorage.getItem(LANG_KEY); } catch (e) {}
  if (!savedLang) {
    savedLang = location.hostname.indexOf('clinicalgames.fi') !== -1 ? 'fi' : 'en';
  }
  applyLanguage(savedLang);

  // ── Image lightbox ──────────────────────────────────────
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');

  function openLightbox(src, alt) {
    lightboxImg.src = src;
    lightboxImg.alt = alt || '';
    lightbox.classList.remove('hidden');
  }

  function closeLightbox() {
    lightbox.classList.add('hidden');
    lightboxImg.src = '';
  }

  var sectionImages = document.querySelectorAll('.game-media-box img');
  for (var m = 0; m < sectionImages.length; m++) {
    sectionImages[m].addEventListener('click', function () {
      openLightbox(this.src, this.alt);
    });
  }

  lightbox.addEventListener('click', function (event) {
    if (event.target === lightbox) closeLightbox();
  });

  document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') closeLightbox();
  });

  // ── Contact form (Formspree AJAX) ───────────────────────
  var contactForm = document.getElementById('contact-form');
  var contactSuccess = document.getElementById('contact-success');
  var contactError = document.getElementById('contact-error');

  contactForm.addEventListener('submit', function (event) {
    event.preventDefault();
    contactError.classList.add('form-hidden');

    fetch(contactForm.action, {
      method: 'POST',
      body: new FormData(contactForm),
      headers: { 'Accept': 'application/json' }
    }).then(function (response) {
      if (response.ok) {
        contactForm.classList.add('form-hidden');
        contactSuccess.classList.remove('form-hidden');
      } else {
        contactError.classList.remove('form-hidden');
      }
    }).catch(function () {
      contactError.classList.remove('form-hidden');
    });
  });
</script>

</body>
</html>
